# Trusted MergePay configuration.
#
# Commit this file as `.github/mergepay.yml` on the default branch of the
# consumer repository. It is fetched through the GitHub API at the
# default-branch ref and is never loaded from pull-request head content.
#
# `repository` must match the repository that runs the workflow.
# `chain` values are allowlisted from live KeeperHub verification.
# `recipients` maps GitHub logins to payout wallets.
# Amounts and `maximum` are decimal strings whose fractional digits never
# exceed the token decimals; excess precision is rejected.

version: 1
repository: acme/mergepay-demo
chain:
  id: 11155111
  explorer: https://sepolia.etherscan.io
  token:
    address: "0x1c7d4b196cb0c7b01d743fbc6116a902379c7238"
    symbol: USDC
    decimals: 6
payout:
  requiredLabel: mergepay-approved
  maximum: "25"
  amounts:
    mergepay-5: "5"
    mergepay-10: "10"
recipients:
  alice: "0x05619d1a133623b322a8f366ea9594e4e586f26d"
checks:
  required: true
  names:
    - CI / test
