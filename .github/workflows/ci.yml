name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA: actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned by commit SHA: actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run verify:packaged
